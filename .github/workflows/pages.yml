name: Publish game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare game files
        run: |
          mkdir site
          cp index.html style.css app.js battle.js bot.js battle-turn.js battle-worker.js sniper-fx.js encounter-rules.js giant-rules.js tuning.js room.js site/
          cp -r _compat assets pieces site/
          mkdir site/vendor
          cp node_modules/peerjs/dist/peerjs.min.js site/vendor/
          cp node_modules/peerjs/LICENSE site/vendor/peerjs-LICENSE
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
